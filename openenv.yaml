  # Easy Tasks (task1_1 to task1_10)
  - id: "task1_1"
    name: "task1_1"
    difficulty: "easy"
    description: "Easy variant 1"
    python: "tasks:task1_1"
    grader: "grader:grade_task1_1"
  - id: "task1_2"
    name: "task1_2"
