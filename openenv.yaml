grading:
  module: grader
  per_task:
    # Easy
    - function: grade_task1_1
      task_id: task1_1
    - function: grade_task1_2
      task_id: task1_2
    - function: grade_task1_3
      task_id: task1_3
    - function: grade_task1_4
      task_id: task1_4
    - function: grade_task1_5
      task_id: task1_5
    - function: grade_task1_6
      task_id: task1_6
    - function: grade_task1_7
      task_id: task1_7
    - function: grade_task1_8
      task_id: task1_8
    - function: grade_task1_9
      task_id: task1_9
    - function: grade_task1_10
      task_id: task1_10
    # Medium
    - function: grade_task2_1
      task_id: task2_1
    - function: grade_task2_2
      task_id: task2_2
    - function: grade_task2_3
      task_id: task2_3
    - function: grade_task2_4
      task_id: task2_4
    - function: grade_task2_5
      task_id: task2_5
    - function: grade_task2_6
      task_id: task2_6
    - function: grade_task2_7
      task_id: task2_7
    - function: grade_task2_8
      task_id: task2_8
    - function: grade_task2_9
      task_id: task2_9
    - function: grade_task2_10
      task_id: task2_10
    # Hard
    - function: grade_task3_1
      task_id: task3_1
    - function: grade_task3_2
      task_id: task3_2
    - function: grade_task3_3
      task_id: task3_3
    - function: grade_task3_4
      task_id: task3_4
    - function: grade_task3_5
      task_id: task3_5
    - function: grade_task3_6
      task_id: task3_6
    - function: grade_task3_7
      task_id: task3_7
    - function: grade_task3_8
      task_id: task3_8
    - function: grade_task3_9
      task_id: task3_9
    - function: grade_task3_10
      task_id: task3_10
  aggregate: grade_all_tasks
  score_range: [0.05, 0.95]

inference:
  script: inference.py
  modes:
    - llm    # OpenAI API (with mock fallback)
    - dqn    # Pre-trained DQN checkpoint
    - mock   # Deterministic heuristic

models:
  observation:
    class: environment.Observation
    fields:
      - bus_position: int
      - fuel: float
      - onboard_passengers: int
      - queue_current_stop: int
      - queue_next_stop: int
      - queue_next_next_stop: int
      - time_step: int

  action:
    class: environment.Action
    fields:
      - action: int  # 0, 1, or 2

  reward:
    class: environment.Reward
    fields:
      - value: float
      - passengers_picked: int
      - fuel_used: float
      - penalties_applied: list[str]

tags:
  - openenv
  - reinforcement-learning
  - bus-routing
  - dqn
  - transportation
