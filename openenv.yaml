    # Hard
    - function: grade_task21
      task_id: task21
    - function: grade_task22
      task_id: task22
    - function: grade_task23
      task_id: task23
    - function: grade_task24
      task_id: task24
    - function: grade_task25
      task_id: task25
    - function: grade_task26
      task_id: task26
    - function: grade_task27
      task_id: task27
    - function: grade_task28
      task_id: task28
    - function: grade_task29
      task_id: task29
    - function: grade_task30
      task_id: task30
  aggregate: grade_all_tasks
  score_range: [0.05, 0.95]

inference:
  script: inference.py
  modes:
    - llm    # OpenAI API (with mock fallback)
    - dqn    # Pre-trained DQN checkpoint
    - mock   # Deterministic heuristic

models:
  observation:
    class: environment.Observation
    fields:
      - bus_position: int
      - fuel: float
      - onboard_passengers: int
      - queue_current_stop: int
      - queue_next_stop: int
      - queue_next_next_stop: int
      - time_step: int

  action:
    class: environment.Action
    fields:
      - action: int  # 0, 1, or 2

  reward:
    class: environment.Reward
    fields:
      - value: float
      - passengers_picked: int
      - fuel_used: float
      - penalties_applied: list[str]

tags:
  - openenv
  - reinforcement-learning
  - bus-routing
  - dqn
  - transportation
