grading:
  module: grader
  per_task:
    # Easy
    - function: grade_task1
      task_id: task1
    - function: grade_task2
      task_id: task2
    - function: grade_task3
      task_id: task3
    - function: grade_task4
      task_id: task4
    - function: grade_task5
      task_id: task5
    - function: grade_task6
      task_id: task6
    - function: grade_task7
      task_id: task7
    - function: grade_task8
      task_id: task8
    - function: grade_task9
      task_id: task9
    - function: grade_task10
      task_id: task10
    # Medium
    - function: grade_task11
      task_id: task11
    - function: grade_task12
      task_id: task12
    - function: grade_task13
      task_id: task13
    - function: grade_task14
      task_id: task14
